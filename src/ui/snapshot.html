<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="light dark">
  <title>X 友 · 本机快照</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0;
      font: 14px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: Canvas;
      color: CanvasText;
    }
    main { max-width: 720px; margin: 48px auto; padding: 0 24px; }
    h1 { font-size: 20px; margin: 0 0 8px; }
    .hint { color: GrayText; margin: 0 0 20px; }
    #status {
      padding: 12px 14px;
      border: 1px solid color-mix(in srgb, CanvasText 18%, transparent);
      border-radius: 10px;
      margin: 0 0 16px;
    }
    #status.err { color: #b42318; }
    button {
      font: inherit;
      padding: 8px 14px;
      border: 0;
      border-radius: 8px;
      background: #1d9bf0;
      color: #fff;
      cursor: pointer;
    }
    button:disabled { opacity: .5; cursor: default; }
    pre {
      white-space: pre-wrap;
      word-break: break-word;
      background: color-mix(in srgb, CanvasText 6%, transparent);
      padding: 14px;
      border-radius: 10px;
    }
    footer { color: GrayText; font-size: 12px; margin-top: 20px; }
  </style>
</head>
<body>
  <main>
    <h1>X 友 · 本机快照</h1>
    <p class="hint">只读扩展自己的 <code>chrome.storage.local</code> 和 IndexedDB，生成一份 JSON。不会发请求，不会修改数据。</p>
    <div id="status" role="status">正在读取…</div>
    <button id="save" disabled>下载快照</button>
    <pre id="summary"></pre>
    <footer>快照包含账号标识和回复内容，只保存在本机。文件默认落在浏览器下载目录。</footer>
  </main>
  <script type="module" src="snapshot.js"></script>
</body>
</html>
